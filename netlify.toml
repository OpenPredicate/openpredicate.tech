# Netlify build configuration.
#
# The build is a plain `node build.mjs` with no network access, so there is
# nothing to configure beyond the command, the output directory and the Node
# version. Clean URLs (`/spec/` → `/spec/index.html`), the `404.html` fallback,
# the apex/www redirect and HTTPS are all Netlify defaults, which is what
# serve.mjs imitates locally.
#
# Response headers are deliberately NOT declared here. Netlify cannot scope
# headers in this file to a deploy context — they are "global for all builds and
# cannot be scoped for specific branches or deploy contexts" — and the schema's
# rules need to follow the versions that actually exist. Both are decided at
# build time instead, and written to `dist/_headers`. See buildMeta in build.mjs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
