# Netlify build configuration.
#
# The build is a plain `node build.mjs` with no network access, so there is
# nothing to configure beyond the command, the output directory and the Node
# version. Clean URLs (`/spec/` → `/spec/index.html`) and the `404.html`
# fallback are Netlify defaults, which is what serve.mjs imitates locally.
#
# Per-file response headers are not here: `dist/_headers` is generated by the
# build, so the schema's media type and cache policy follow the versions that
# actually exist rather than a list kept by hand.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch builds should never be indexed, and must not
# advertise the production sitemap as their own.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
