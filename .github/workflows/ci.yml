#
# CI — run the tests on every pull request and every push to main.
#
# Netlify builds a preview for a pull request, which catches a build that
# throws but not an assertion that fails. This is what actually gates a merge.
#
# The two suites run as separate jobs so a contributor sees both results at
# once rather than only the first failure.
#
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  layout:
    name: Layout and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The runner image ships Chrome, but pin it explicitly: if it ever stops
      # doing so, this must fail loudly rather than let the suite skip.
      - name: Locate Chrome
        run: |
          set -euo pipefail
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser
          do
            if [ -x "$candidate" ]; then
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate ($("$candidate" --version 2>/dev/null || echo '?'))"
              exit 0
            fi
          done
          echo "::error::No Chrome or Chromium on this runner — the layout tests cannot run."
          exit 1

      - run: npm run test:layout
